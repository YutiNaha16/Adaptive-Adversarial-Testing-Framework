name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (pinned, hashed) and build the environment
        run: make setup

      - name: Lint (ruff)
        run: make lint

      - name: Run tests
        run: make test
