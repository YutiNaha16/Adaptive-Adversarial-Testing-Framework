name: aatf-lab

networks:
  lab:
    name: aatf-lab
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: aatf-lab-br
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  attacker:
    build:
      context: ..
      dockerfile: lab/Dockerfile.attacker
    container_name: aatf-attacker
    networks:
      - lab
    command: ["sleep", "infinity"]
    restart: "no"

  defender:
    image: alpine:3.19
    container_name: aatf-defender
    networks:
      - lab
    command: ["sleep", "infinity"]
    restart: "no"

  environment:
    image: alpine:3.19
    container_name: aatf-environment
    networks:
      - lab
    command: ["sleep", "infinity"]
    restart: "no"

  suricata:
    build:
      context: ..
      dockerfile: lab/Dockerfile.suricata
    container_name: aatf-suricata
    network_mode: host
    volumes:
      - ../logs/suricata:/var/log/suricata
      - ./rules/disabled.conf:/lab-rules/disabled.conf:ro
    restart: "no"
    depends_on:
      - attacker
      - defender
      - environment
