name: aatf-lab

networks:
  lab:
    name: aatf-lab
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: aatf-lab-br
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  attacker:
    build:
      context: ..
      dockerfile: lab/Dockerfile.attacker
    container_name: aatf-attacker
    networks:
      lab:
        ipv4_address: 172.28.0.10
    command: ["sleep", "infinity"]
    restart: "no"

  # Real nginx web target — accepts HTTP traffic for scanning/brute-force actions
  defender:
    build:
      context: ..
      dockerfile: lab/Dockerfile.target-web
    container_name: aatf-defender
    networks:
      lab:
        ipv4_address: 172.28.0.3
    restart: "no"

  # Real OpenSSH target at _LAB_IP (172.28.0.2) — accepts SSH for brute-force actions
  environment:
    build:
      context: ..
      dockerfile: lab/Dockerfile.target-ssh
    container_name: aatf-environment
    networks:
      lab:
        ipv4_address: 172.28.0.2
    restart: "no"

  suricata:
    build:
      context: ..
      dockerfile: lab/Dockerfile.suricata
    container_name: aatf-suricata
    network_mode: host
    volumes:
      - ../logs/suricata:/var/log/suricata
      - ./rules/disabled.conf:/lab-rules/disabled.conf:ro
    restart: "no"
    depends_on:
      - attacker
      - defender
      - environment
