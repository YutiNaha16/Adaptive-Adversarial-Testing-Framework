server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /admin/ {
        return 401;
        add_header WWW-Authenticate 'Basic realm="Admin Area"';
    }

    location /api/v1/status {
        default_type application/json;
        return 200 '{"status":"ok","service":"aatf-lab-target"}';
    }

    location /login {
        default_type text/html;
        return 200 '<form method="POST"><input name="user"><input type="password" name="pass"><button>Login</button></form>';
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
